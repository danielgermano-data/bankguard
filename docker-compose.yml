services:
  postgres:
    image: postgres:16
    container_name: bankguard-postgres
    environment:
      POSTGRES_DB: bankguard
      POSTGRES_USER: bankguard_user
      POSTGRES_PASSWORD: bankguard_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankguard_user -d bankguard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

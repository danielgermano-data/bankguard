name: Update README graphs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-graphs:
    runs-on: ubuntu-latest

    env:
      PROJECT_REPO: danielgermano-data/bankguard
      ACCENT_COLOR: "#8b5cf6"
      BACKGROUND_COLOR: "#090615"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate README graphs
        run: node scripts/generate-readme-graphs.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated graphs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update README graphs"
          file_pattern: assets/readme/*.svg